name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib

      - name: Test agent binary installers
        run: bash tests/agent_installers.sh

      - name: Test OpenCode notification plugin
        run: node --test tests/opencode_plugin.mjs

      - name: Run e2e tests
        run: cargo test --test e2e

  installers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, opencode]
        image: [ubuntu, node, rust, python]
    steps:
      - uses: actions/checkout@v7
      - name: Test installer in a real container
        env:
          CONTAINER_ENGINE: docker
        run: bash tests/container_installers.sh "${{ matrix.agent }}" "${{ matrix.image }}"
